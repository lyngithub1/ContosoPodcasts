# Continuous deployment — build + push the API image, roll the Container App,
# and build + publish the SPA. Uses Microsoft Entra WORKLOAD IDENTITY FEDERATION
# (OIDC) — there are NO stored cloud credentials/secrets for Azure sign-in.
#
# Trigger: manual (workflow_dispatch) or push to main that touches app/infra code.
# This mirrors the validated manual deploy loop:
#   az acr build --registry <ACR> --image podstudio-api:<sha> apps/api
#   az containerapp update -n podstudio-api -g <RG> --image <ACR>.azurecr.io/podstudio-api:<sha>
#   (SPA) npm run build --workspace @studio/web  ->  SWA deploy
#
# ---------------------------------------------------------------------------
# One-time setup the repository owner must do (NOT done by this workflow):
#   1. Repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#        AZURE_RESOURCE_GROUP   = <your resource group>
#        ACR_NAME               = <your container registry name>
#        CONTAINERAPP_NAME      = <your container app name, e.g. podstudio-api>
#        API_BASE_URL           = https://<your-apim>.azure-api.net/studio
#   2. Repository SECRETS:
#        AZURE_CLIENT_ID        = <app registration / MI client id with a federated credential for this repo>
#        AZURE_TENANT_ID        = <your Entra tenant id>
#        AZURE_SUBSCRIPTION_ID  = <your subscription id>
#        SWA_DEPLOYMENT_TOKEN   = <Static Web App deployment token>
#   3. Create the federated credential (example):
#        az ad app federated-credential create --id <AZURE_CLIENT_ID> --parameters '{
#          "name":"gh-contosopodcasts-main",
#          "issuer":"https://token.actions.githubusercontent.com",
#          "subject":"repo:<owner>/<repo>:ref:refs/heads/main",
#          "audiences":["api://AzureADTokenExchange"]}'
#      and grant that identity AcrPush on the ACR + Contributor on the Container App.
# ---------------------------------------------------------------------------
name: Deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write # required for OIDC federated login
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build API image in ACR
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME }} \
            --image podstudio-api:${{ steps.meta.outputs.tag }} \
            apps/api

      - name: Roll Container App to the new image
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/podstudio-api:${{ steps.meta.outputs.tag }}

      - name: Wait for a healthy revision
        run: |
          fqdn=$(az containerapp show -n ${{ vars.CONTAINERAPP_NAME }} -g ${{ vars.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$fqdn/healthz" || true)
            echo "attempt $i: /healthz -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "API did not become healthy in time" >&2
          exit 1

  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-api
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA (API URL baked in)
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build --workspace @studio/web

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
